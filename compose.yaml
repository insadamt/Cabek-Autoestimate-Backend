services:
  app:
    build:
      context: .
      target: app
    image: autoestimate-app:${AUTOESTIMATE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-AutoEstimate}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set in .env}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      AUTOESTIMATE_API_RATE_LIMIT: ${AUTOESTIMATE_API_RATE_LIMIT:-120}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - autoestimate

  nginx:
    build:
      context: .
      target: nginx
    image: autoestimate-nginx:${AUTOESTIMATE_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${AUTOESTIMATE_BIND_ADDRESS:-127.0.0.1}:${AUTOESTIMATE_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - autoestimate

  database:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set in .env}
      MARIADB_USER: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - autoestimate_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - autoestimate

networks:
  autoestimate:
    driver: bridge

volumes:
  autoestimate_db:
